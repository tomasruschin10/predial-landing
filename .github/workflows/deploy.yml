name: Deploy a GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      # SPA en Pages: una copia de index.html por ruta (responde 200) y 404.html para el resto
      - run: |
          for r in emprendimiento/montaneses-2400 almagro departamentos-3-4-ambientes departamentos-en-venta-caba gracias gracias-tasacion no-gracias-tasacion tasacion tasacion-Meta-Ads tasacion-meta-ads; do
            mkdir -p "dist/$r" && cp dist/index.html "dist/$r/index.html"; done
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
